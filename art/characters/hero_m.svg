    <path d="M96 150 Q82 222 70 266 L118 252 Z" fill="#1d2e35"/>
    <!-- jambe avant -->
    <path d="M128 208 L140 286 L154 284 L146 206 Z" fill="#2b363e"/>
    <path d="M136 282 L158 280 Q170 290 172 306 L134 306 Z" fill="#5a3f2d"/>
    <!-- manteau -->
    <path d="M94 124 Q122 112 152 124 L158 208 Q166 236 174 258 L128 246 L104 254 Q98 220 92 200 Z" fill="url(#coat)"/>
    <path d="M150 128 L156 206 Q162 230 170 252 L160 250 Q150 226 146 204 L142 132 Z" fill="#4fd6e8" stroke-width="2"/>
    <!-- buste -->
    <path d="M98 122 Q124 110 150 122 L152 196 Q124 204 96 196 Z" fill="url(#torso)"/>
    <!-- sangle et ceinture -->
    <path d="M100 126 L148 190" fill="none" stroke="#2a1d14" stroke-width="7"/>
    <path d="M100 126 L148 190" fill="none" stroke="#7b5636" stroke-width="3"/>
    <rect x="94" y="188" width="60" height="12" rx="3" fill="#3a2a1e"/>
    <rect x="118" y="186" width="12" height="16" rx="2" fill="#c49a5a" stroke-width="2"/>
    <!-- fiole de sérum -->
    <rect x="100" y="196" width="12" height="22" rx="5" fill="url(#vial)" stroke-width="2"/>
    <!-- cou et écharpe -->
    <path d="M114 100 L134 100 L134 118 L114 118 Z" fill="url(#skin)"/>
    <path d="M104 110 Q124 124 148 110 L150 124 Q124 136 102 124 Z" fill="#a4482f"/>
    <path d="M106 122 L96 150 L110 146 L114 126 Z" fill="#8a3a26"/>
    <!-- tête -->
    <path d="M106 66 Q108 40 132 40 Q156 42 156 70 Q156 94 140 104 Q122 108 112 96 Q104 86 106 66 Z" fill="url(#skin)"/>
    <path d="M146 76 L158 82 L148 86 Z" fill="#c98f69" stroke-width="2"/>
    <!-- cheveux courts -->
    <path d="M102 70 Q98 34 132 32 Q162 34 160 62 Q150 50 136 52 Q138 60 128 62 Q122 52 112 60 Q110 74 104 82 Z" fill="#3a2619"/>
    <!-- œil et sourcil -->
    <path d="M140 70 L150 69" fill="none" stroke-width="3"/>
    <ellipse cx="146" cy="76" rx="2.5" ry="3" fill="#11171b" stroke="none"/>
    <path d="M136 92 Q142 94 148 92" fill="none" stroke-width="2"/>
    <!-- bras avant tendu (main en 170,176) -->
    <path d="M140 128 Q160 140 166 170 L152 176 Q148 152 132 140 Z" fill="#3e5d67"/>
    <path d="M150 162 L170 158 L172 174 L154 178 Z" fill="#2f2219"/>
    <ellipse cx="170" cy="176" rx="10" ry="9" fill="url(#skin)"/>
  </g>
