<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!-- Héros (base masculine) — placeholder original Val'Serra. Tourné vers la droite. Pieds en (120,306). -->
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#46646d"/><stop offset="1" stop-color="#22353d"/>
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#557780"/><stop offset="1" stop-color="#34505a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c39b"/><stop offset="1" stop-color="#c98f69"/>
    </linearGradient>
    <radialGradient id="vial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9fbff"/><stop offset="0.5" stop-color="#5fe3ff"/><stop offset="1" stop-color="#1f8aa6"/>
    </radialGradient>
  </defs>
  <g stroke="#11171b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- bras arrière -->
    <path d="M100 128 Q86 160 92 192 L104 190 Q102 162 112 136 Z" fill="#2c434b"/>
    <!-- jambe arrière -->
    <path d="M106 206 L98 288 L112 290 L122 210 Z" fill="#232c33"/>
    <path d="M94 284 L116 284 L118 306 L84 306 Q84 292 94 284 Z" fill="#4a3426"/>
